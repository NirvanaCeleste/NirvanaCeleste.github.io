baseURL = 'https://NirvanaCeleste.github.io/'
locale = 'zh-cn'                   # Hugo 0.158+ 的站点语言键（设 defaultContentLanguage 会开启多语言模式，多出个没用的语言切换按钮）
title = "NirvanaCeleste's Blog"

[params]
  mainSections = ['acm', 'omori']
  enableSidebar = true
  enableSearch = false
  math = true
  dateFormat = '2006-01-02'   # 全站日期统一 ISO 短格式，和题解正文一致

  [params.article]
    showReadingTime = false   # 「14 字 · 1 分钟」是模板噪音
    showWordCount = false

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["html", "rss", "json"]

  [params.comments]
    enabled = true
    provider = "giscus" # 指定使用 giscus

  # giscus 必须挂在 comments 子表下（写成独立 [params.giscus] 主题读不到，评论区整块不渲染）
  [params.comments.giscus]
    repo = "NirvanaCeleste/NirvanaCeleste.github.io"
    repoId = "R_kgDOTLg_BA"
    category = "General"
    categoryId = "DIC_kwDOTLg_BM4DAs4c"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"   # 跟随访问者系统明暗，暗色下不再是白框
    lang = "zh-CN"

[menu]
  [[menu.main]]
    name = '主页'
    url = '/'
    weight = 1
  [[menu.main]]
    name = 'ACM 题解'
    url = '/acm/'
    weight = 2
  [[menu.main]]
    name = 'OMORI 模组'
    url = '/omori/'
    weight = 3
  [[menu.main]]
    name = '关于'
    url = '/about/'
    weight = 4
  [[menu.main]]
    name = '搜索'
    url = '/search/'
    weight = 5

[header]
  showLanguageSelector = false   # 单语言站点，语言切换器是个点了没反应的按钮

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # 这一行必须加上，否则 Giscus 的脚本会被安全机制删掉

    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false  # 独立成行的图片不再包在 <p> 里（避免 figure 嵌套）

    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\[', '\]']]
          inline = [['$', '$'], ['\(', '\)']]

[module]
proxy = "https://goproxy.cn"
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v2"