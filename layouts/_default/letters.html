{{ define "main" }}
  {{/* 机制保留：涂黑改变故事——审查版像共犯毁灭证据，原件是另一回事 */}}
  <article class="rm-page">
    <div class="rm-stage lt-stage" aria-label="被涂黑的信">
      <div class="lt-head">
        <span class="lt-title">病房来信 · 发件人栏被水洇过</span>
        <span class="lt-tabs">
          <button class="lt-btn active" data-v="censor">审查版</button>
          <button class="lt-btn" data-v="origin">原件</button>
        </span>
      </div>

      <div class="lt-letter" id="lt-letter" aria-live="polite"></div>

      <div class="rm-out" id="lt-out"></div>
      <a class="rm-back" href="/">❮ ~/home</a>
    </div>
  </article>

  <script>
  (function () {
    "use strict";
    /* 剧本原文节选；█ = 审查涂黑 */
    var LETTER = {
      censor: [
        "亲爱的：",
        "一切都处理好了。█████也不在了。没有人问起██████。",
        "他们要是再查下去，我就把剩下的█████也处理掉。",
        "在里面别多想。管好自己的嘴。等风吹过去，我来接你。",
        "——你的同桌"
      ],
      origin: [
        "亲爱的：",
        "一切都处理好了。你阳台那盆枯掉的花也不在了。没有人问起你请了多久病假。",
        "他们要是再问下去，我就把剩下的寒假作业也帮你写掉。真的，我数学比上学期好了很多。",
        "在里面别多想。管好自己的身体，按时吃饭。等风吹过去，我来接你。",
        "——你的同桌"
      ]
    };
    var letter = document.getElementById("lt-letter");
    var out = document.getElementById("lt-out");

    function render(v) {
      letter.innerHTML = "";
      LETTER[v].forEach(function (p) {
        var el = document.createElement("p");
        if (v === "censor") {
          /* █ 涂黑块染成实心黑条 */
          el.innerHTML = p.replace(/█+/g, function (m) {
            return '<span class="lt-black" style="display:inline-block;min-width:' +
              (m.length * 0.62) + 'em;height:1em;vertical-align:-0.12em"></span>';
          });
        } else {
          el.textContent = p;
        }
        letter.appendChild(el);
      });
    }

    document.querySelectorAll(".lt-btn").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll(".lt-btn").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        render(b.dataset.v);
        out.textContent = b.dataset.v === "origin"
          ? "（涂黑拿掉之后，是另一个故事。）"
          : "（例行审查之后，读到的样子。）";
      });
    });
    render("censor");
    out.textContent = "（例行审查之后，读到的样子。）";
  })();
  </script>
{{ end }}
