{{ define "main" }}
  <article class="bs-page">
    <div class="bs-room" id="bs-room" aria-label="空房间">
      <svg viewBox="0 0 900 480" class="bs-svg" role="img" preserveAspectRatio="xMidYMid slice">
        {{/* 门 → /save/ */}}
        <g class="bs-item" id="it-door" data-hint="门">
          <rect x="640" y="180" width="120" height="230" rx="4" class="bs-stroke" />
          <circle cx="742" cy="300" r="5" class="bs-fill" />
        </g>

        {{/* 吊灯 */}}
        <g class="bs-item bs-lamp" id="it-lamp" data-hint="灯">
          <line x1="240" y1="0" x2="240" y2="90" class="bs-stroke" />
          <path d="M212 90 h56 l-14 34 h-28 z" class="bs-stroke" />
          <circle cx="240" cy="112" r="7" class="bs-bulb2" />
        </g>

        {{/* 小刀 */}}
        <g class="bs-item bs-knife" id="it-knife" data-hint="刀">
          <rect x="440" y="300" width="8" height="70" rx="3" class="bs-stroke" transform="rotate(18 444 335)" />
          <rect x="430" y="364" width="28" height="12" rx="4" class="bs-stroke" transform="rotate(18 444 370)" />
        </g>

        {{/* 影子 */}}
        <g class="bs-item bs-shadow" id="it-shadow" data-hint="影子">
          <ellipse cx="120" cy="380" rx="64" ry="46" class="bs-ghost2" />
          <circle cx="100" cy="372" r="4" class="bs-eyebg" />
          <circle cx="140" cy="372" r="4" class="bs-eyebg" />
        </g>

        <line x1="40" y1="440" x2="860" y2="440" class="bs-floor" />
      </svg>

      <a class="bs-back" href="/">❮ ~/home</a>

      {{/* 控制台输出条（打字机） */}}
      <div class="bs-dlg" id="bs-dlg">
        <div class="bs-dlg-text" id="bs-dlg-text"></div>
        <div class="bs-dlg-next" id="bs-dlg-next">▾</div>
      </div>
    </div>
  </article>

  <script>
  (function () {
    "use strict";
    var dlg = document.getElementById("bs-dlg");
    var textEl = document.getElementById("bs-dlg-text");
    var nextEl = document.getElementById("bs-dlg-next");
    var queue = [];
    var typing = false;
    var typeTimer = null;
    var cur = null;

    function pump() {
      if (typing) return;
      cur = queue.shift();
      if (!cur) { dlg.classList.remove("on"); return; }
      dlg.classList.add("on");
      typing = true;
      nextEl.style.opacity = 0;
      var i = 0;
      clearInterval(typeTimer);
      textEl.textContent = "";
      typeTimer = setInterval(function () {
        if (i >= cur.length) {
          clearInterval(typeTimer);
          typing = false;
          nextEl.style.opacity = "";
          return;
        }
        textEl.textContent += cur[i++];
      }, 34);
    }
    function say(lines) {
      lines.forEach(function (t) { queue.push(t); });
      pump();
    }

    /* 点击控制台：打字中=快进，已打完=下一句 */
    dlg.addEventListener("click", function () {
      if (typing && cur) {
        clearInterval(typeTimer);
        textEl.textContent = cur;
        typing = false;
        nextEl.style.opacity = "";
      } else { pump(); }
    });

    var LINES = {
      lamp: ["灯在晃。", "没人碰它。"],
      knife: ["那个别碰。"],
      shadow: ["（影子转向你。）", "（没有眼睛。）", "（它又转回去了。）"]
    };
    var room = document.getElementById("bs-room");
    document.querySelectorAll(".bs-item").forEach(function (el) {
      el.addEventListener("mouseenter", function () { room.dataset.hover = el.dataset.hint || ""; });
      el.addEventListener("mouseleave", function () { room.dataset.hover = ""; });
      el.addEventListener("click", function () {
        var id = el.id.replace("it-", "");
        if (id === "door") {
          say(["门开了。"]);
          setTimeout(function () { window.location.href = "/save/"; }, 700);
          return;
        }
        if (id === "lamp") { room.classList.toggle("lit"); }
        say(LINES[id] || ["……"]);
      });
    });

    setTimeout(function () {
      say(["空的房间。", "（东西可以点。）"]);
    }, 600);
  })();
  </script>
{{ end }}
